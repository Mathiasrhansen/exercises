<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="js.js" defer></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <h1>Simpel lommeregner</h1>
      <label for="tal1">1. tal</label>
      <input type="number" id="tal1" />
      <label for="regneart">Vælg regneart</label>
      <select name="regneart" id="regneart" required>
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
      </select>
      <label for="tal2">2. tal</label>
      <input type="number" id="tal2" />
      <button id="result">Beregn</button>
      <div class="resultContainer">
        <p id="resultText"></p>
      </div>
    </div>
  </body>
</html>
