<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body class="">
    <header data-theme="light">
      <h1>Theme Switcher</h1>
      <select name="theme-selector" id="theme-selector">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="hawaii">Hawaii</option>
      </select>
    </header>
    <main data-theme="light">
      <p>Content</p>
      <a
        href="https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Selectors/Attribute_selectors"
        >Attribute selectors on MDN</a
      >
    </main>
    <footer data-theme="light"><h2>Footer</h2></footer>
  </body>
</html>
